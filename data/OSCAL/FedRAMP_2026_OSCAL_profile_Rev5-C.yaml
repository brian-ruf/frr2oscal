    alters:
    - control-id: ia-5
      adds:
      - position: ending
        parts:
        - name: guidance
          prose: 'Authenticators must be compliant with NIST SP 800-63-3 Digital Identity
            Guidelines IAL, AAL, FAL level 2. Link https://pages.nist.gov/800-63-3


            IA-5 Guidance: SP 800-63C Section 6.2.3 Encrypted Assertion requires that
            authentication assertions be encrypted when passed through third parties,
            such as a browser. For example, a SAML assertion can be encrypted using
            XML-Encryption, or an OpenID Connect ID Token can be encrypted using JSON
            Web Encryption (JWE).'
